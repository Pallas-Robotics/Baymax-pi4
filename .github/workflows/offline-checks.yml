# Runs the offline review gate (Baymax-main/check_release.py) on every pull
# request: with the robots' own pins (requirements-orange-pi.txt: NumPy 1.26,
# OpenCV 4.10, MediaPipe 0.10.18) on Linux ARM64, the Orange Pi's OS and CPU,
# and with the desktop pins (requirements-pc.txt: NumPy 2, OpenCV 4.13) on
# Linux, Windows and macOS. Based on Natey's
# docs/ci/desktop-offline.yml.example (now removed). It never opens a microphone, camera or
# speaker and never contacts Gemini or another provider: no secrets are used.
# A green run is offline evidence only; live checks and James's approval are
# still needed (TESTING_PROTOCOL.md).
name: Offline checks

# Paths: everything check_release.py runs or reads: the application, the root checks
# it also runs (tests/overall with test/monitor-chat.cjs, the devops/performance
# sampler) and all of devops/, whose Python those checks parse and whose robot
# updater (devops/mvp/update.py) and launchers (devops/clickables) its tests load.
# The SD-card and Graphify suites themselves run with tests/run.py
# (devops/ci/feature-validation.yml.example).
on:
  pull_request:
  push:
    # All channel pushes run checks, including documentation and deployment changes.
    branches: [main, MVP, release, deploy, needshardwaretest, needssimtest, needssoftwaretest, experimental]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The robots. Code that needs NumPy 2 or OpenCV 4.13 passes the desktop
          # jobs and then breaks on the OPI4; this job catches it.
          - name: Orange Pi (Linux ARM64)
            os: ubuntu-24.04-arm
            requirements: requirements-orange-pi.txt
            timeout: 60   # Some ARM64 packages (e.g. Praat-Parselmouth) may build from source.
          - name: Linux desktop
            os: ubuntu-latest
            requirements: requirements-pc.txt
          - name: Windows
            os: windows-latest
            requirements: requirements-pc.txt
          - name: macOS
            os: macos-latest
            requirements: requirements-pc.txt
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout || 25 }}
    defaults:
      run:
        working-directory: Baymax-main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Baymax-main/${{ matrix.requirements }}

      - name: Linux libraries (same as the robot image)
        if: runner.os == 'Linux'
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2 libgl1 libegl1 libgles2 libsndfile1

      - name: Install ${{ matrix.requirements }} (no credentials or capture)
        run: python -m pip install -r ${{ matrix.requirements }}

      - name: Check working protocol and Graphify map
        working-directory: .
        run: |
          python devops/graphify/check.py
          python -m unittest discover -s devops/graphify -p "test_*.py"

      - name: Run core and toolkit offline gate
        run: python check_release.py --report .local-review/report.md

      - name: Verify native Mac frameworks import
        if: runner.os == 'macOS'
        run: python -c "import AVFoundation, cv2, sounddevice; assert callable(AVFoundation.AVCaptureDevice.devicesWithMediaType_)"

      - name: Add the report to the run summary
        if: always()
        shell: bash
        run: |
          if [ -f .local-review/report.md ]; then
            { echo "## ${{ matrix.name }}"; sed -n '1,/^## Core: live checks/p' .local-review/report.md | sed '$d'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-report-${{ matrix.os }}
          retention-days: 7
          path: Baymax-main/.local-review/report.md
          if-no-files-found: ignore
